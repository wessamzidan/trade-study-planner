<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Study Planner dashboard</title>
<style>
:root{--ink:#18222f;--muted:#4b5666;--line:#cfd6df;--bg:#f3f5f8;--card:#fff;--pri:#1d5c8a;--pri-d:#14425f;--pri-t:#e4eef6;
--core:#1d5c8a;--growth:#a64b00;--new:#5b2fa0;--minor:#5d6672;--pos:#0b6b3a;--neg:#a31f1f;--buyer:#8a5a00;--tot:#334155;
--focus:#0b57d0;--r:8px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--pri)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.45rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.95rem}
p{margin:.35rem 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:10}
.skip:focus{left:8px;top:8px}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:.9rem 1rem .6rem}
.wrap{max-width:1240px;margin:0 auto;padding:0 1rem}
header.top .wrap{padding:0}
.sub{color:var(--muted);font-size:.9rem}
.demo{background:#fff4d6;border:1px solid #d9b23a;color:#5a4300;padding:.35rem .6rem;border-radius:6px;font-size:.85rem;margin-top:.5rem}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:.25rem;overflow-x:auto;padding:.4rem 1rem}
[role=tab]{font:inherit;border:1px solid transparent;background:none;color:var(--ink);padding:.5rem .85rem;border-radius:6px;cursor:pointer;white-space:nowrap;min-height:40px}
[role=tab]:hover{background:var(--pri-t)}
[role=tab][aria-selected=true]{background:var(--pri);color:#fff}
main{padding:1rem 0 2rem}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
.grid2>.card{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.75rem;margin-bottom:1rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .85rem}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile .v{font-size:1.4rem;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.pos .v{color:var(--pos)}.tile.neg .v{color:var(--neg)}
button.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--pri);text-decoration:underline;cursor:pointer;text-align:left}
button.btn,select,input[type=search],input[type=text]{font:inherit;border:1px solid #8a95a3;border-radius:6px;background:#fff;color:var(--ink);padding:.4rem .6rem;min-height:38px}
button.btn{cursor:pointer;background:#fff}button.btn:hover{background:var(--pri-t)}
.note{color:var(--muted);font-size:.85rem}
.hl{font-size:1.15rem;font-weight:600}
.tb{display:inline-block;font-size:.68rem;font-weight:650;padding:0 .4em;border-radius:4px;margin-left:.3em;vertical-align:middle;line-height:1.5;border:1px solid transparent;text-transform:lowercase;white-space:nowrap}
.tb-modelled{background:#fff1d6;color:#6e3a00;border-color:#e3b66b}
.tb-published{background:#e3eefa;color:#0f4272;border-color:#9bbde0}
.tb-connector{background:#ddf3ea;color:#0a5238;border-color:#8ccdb3}
.tb-derived{background:#eaedf1;color:#38424f;border-color:#b6bfca}
.tb-verify,.tb-missing{background:#fde7e7;color:#8c1717;border-color:#e39a9a}
.tb-user,.tb-quote{background:#e8f4e8;color:#1d5b1d;border-color:#9fcf9f}
.tier{display:inline-block;font-size:.8rem;font-weight:600;padding:0 .5em;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-core{color:var(--core)}.t-growth{color:var(--growth)}.t-new{color:var(--new)}.t-minor{color:var(--minor)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:#fff;border-radius:99px;padding:.25rem .7rem;cursor:pointer;min-height:34px;color:var(--ink)}
.chip:hover{background:var(--pri-t)}.chip.sel{border-color:var(--pri);font-weight:600}
.tiers3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1rem}
.tiers3 h4{margin-bottom:.1rem}
.tw{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.4rem .6rem;border-bottom:1px solid #e3e7ec;text-align:left;vertical-align:top}
th{background:#eef1f5;font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}tbody tr[data-open]:hover td{background:#f3f8fc}
tr.cur td{background:#eaf3fb}
th button{font:inherit;font-weight:600;background:none;border:0;cursor:pointer;color:inherit;padding:0;min-height:28px}
th button::after{content:" ↕";color:#7b8794}
th[aria-sort=ascending] button::after{content:" ↑";color:var(--ink)}th[aria-sort=descending] button::after{content:" ↓";color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:end;margin-bottom:.75rem}
.filters label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:.15rem}
.filters label.ck{flex-direction:row;align-items:center;gap:.4rem;font-size:.9rem;color:var(--ink);min-height:38px}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.4rem .9rem;margin:0}
.kv{border-bottom:1px solid #edf0f3;padding:.2rem 0}
.kv dt{font-size:.78rem;color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chart{width:100%;min-height:40px}
svg.svgc{display:block;max-width:100%;height:auto;font-family:inherit}
svg text{fill:var(--ink);font-size:11px}svg text.m{fill:var(--muted)}svg text.b{font-weight:650}
svg .ax{stroke:#9aa4b0;stroke-width:1}svg .gl{stroke:#e0e5ea;stroke-width:1}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.8rem 1.2rem;align-items:end}
.ctrl label,.ctrl legend{font-size:.85rem;font-weight:600;display:block}
.ctrl input[type=range]{width:100%;min-height:28px;accent-color:var(--pri)}
.ctrl output{font-variant-numeric:tabular-nums;font-weight:650;color:var(--pri-d)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:flex;gap:.3rem;flex-wrap:wrap}
.seg label{font-weight:500;display:flex;align-items:center;gap:.3rem;border:1px solid #8a95a3;border-radius:6px;padding:.3rem .6rem;min-height:38px;background:#fff;cursor:pointer}
.seg input:checked+span{font-weight:700}
.msg{border-left:4px solid var(--neg);background:#fdf0f0;padding:.6rem .8rem;border-radius:4px}
.msg.info{border-color:var(--pri);background:var(--pri-t)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.82rem;color:var(--muted);margin:.3rem 0}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.3em;vertical-align:-1px}
.sw{display:inline-block;width:1.4em;height:.8em;margin-right:.3em;vertical-align:-1px}
ul.clean{margin:.3rem 0;padding-left:1.1rem}
footer.foot{border-top:1px solid var(--line);padding:1rem;color:var(--muted);font-size:.85rem;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.split{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;justify-content:space-between}
.pos{color:var(--pos)}.neg{color:var(--neg)}
@media (max-width:640px){body{font-size:14.5px}header.top{padding:.7rem .75rem .5rem}.wrap{padding:0 .75rem}nav.tabs .wrap{padding:.3rem .75rem}.card{padding:.75rem}h1{font-size:1.2rem}.tile .v{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
 @page{margin:12mm}
 body{background:#fff;font-size:11pt}
 nav.tabs,.noprint,.skip{display:none!important}
 .panel{display:block!important;margin-bottom:1rem}
 .card,.tile{break-inside:avoid;border-color:#bbb}
 .tw{overflow:visible;border:0}
 a{color:inherit;text-decoration:none}
 header.top{border:0}
 h2.ph{border-bottom:2px solid #333;padding-bottom:.2rem;margin-top:1rem}
}
h2.ph{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{h2.ph{position:static;width:auto;height:auto;clip:auto;overflow:visible}}
</style>

 containers a year would recover the one-time entry cost within 2 months, provided the planned volumes and prices hold."],"recommendations":["Protect the Saudi Arabia business first: it is the largest current market, earns 25.0% per container and its freight rate is a firm quote.","Test prices in the United Kingdom and Germany: obtain two buyer price indications in each market and compare them with the required price in the financial case before committing volume.","Resolve the open data before quoting: the Netherlands duty rate, the Kuwait inland delivery cost, and the gap between Egypt's and the Netherlands' reported trade."],"key_caveat":"Margins for four of the six markets are required prices, not observed ones: they show what must be charged, not what buyers will pay."},"sections":{"scope_method":{"paragraphs":["The study covers one product line, HS 071080 (frozen vegetables not elsewhere specified), exported from Egypt. Trade data cover 2021 to 2026; 2026 is partial, so trends use 2022 to 2025.","Every commercial, freight and tariff figure carries its source and a tier. Modelled freight and tariffs marked 'verify' are estimates that must be checked before any price is quoted."],"bullets":["Trade flows: synthetic Comtrade-shaped data generated for this demonstration.","Freight: two client quotes, one rate tool result, one published rate and two modelled estimates.","Costs, prices and terms: the client's own figures as recorded at scoping."]},"home_position":{"paragraphs":["Egypt's exports reached USD 45.6 million in 2025, up 11.1% a year since 2022. Saudi Arabia is the largest destination, followed by the United Arab Emirates, the Netherlands and the United Kingdom."],"bullets":["The United Arab Emirates did not report its imports for 2025, so Egypt's figure for that market cannot be cross-checked.","The Netherlands reports receiving much less from Egypt than Egypt reports sending, which usually points to goods passing through Dutch ports to other buyers."]},"global_landscape":{"paragraphs":["Reported world imports totalled USD 2,480 million in 2025. The United States is the largest importer with a 26.6% share, followed by Germany, the United Kingdom, France and the Netherlands.","Most of the large importing markets are in Europe and North America, where Egypt's current presence is small."],"bullets":[]},"competition":{"paragraphs":["Egypt is a small supplier in the global ranking. In the markets it already serves it holds a meaningful share: 16.8% of Saudi Arabia's imports and 15.9% of Kuwait's."],"bullets":["In the United Kingdom and Germany, Egypt holds 1.3% and 0.2% of imports respectively: entry would mean taking share from established suppliers."]},"logistics_access":{"paragraphs":["All six lanes use 40-foot reefer containers. Saudi Arabia and the United Arab Emirates have firm forwarder quotes; Germany and Kuwait rely on a distance-based estimate fitted to two published benchmarks, so their freight carries a wide range.","Duties are zero under a trade agreement for Saudi Arabia and the United Kingdom in this demonstration; the Netherlands rate is still to be verified."],"bullets":["Kuwait: the inland delivery cost at destination is missing, so the buyer's landed cost there is not shown.","Each tariff should be re-checked for recent changes before a price is quoted."]},"shortlist":{"paragraphs":["Six markets were taken forward: four existing markets to defend (Saudi Arabia, the United Arab Emirates, the Netherlands and the United Kingdom) and two to expand (Germany and Kuwait)."],"partner_notes":{"SAU":"Largest current market; firm freight quote; zero duty in this demonstration.","ARE":"Second-largest destination but not scored, because it reported no imports for 2025.","NLD":"Large market and likely a re-export hub; duty to be verified.","GBR":"Large and growing market where Egypt is a small supplier.","DEU":"Largest European market; freight is a modelled estimate.","KWT":"Small market where Egypt is already a major supplier."},"not_prioritised":[{"partner":"USA","reason":"Largest importer, but no current presence and the longest lane; worth a separate study once European prices are tested."},{"partner":"RUS","reason":"A current core market, not selected for this demonstration round; it would be modelled the same way once the client confirms prices and payment terms."}]},"financial_case":{"paragraphs":["At current prices Saudi Arabia earns USD 6,720 per container (25.0%) and the United Arab Emirates USD 6,991 (25.3%). Selling at CFR, the client pays freight to the destination port; the buyer pays duty and delivery from there.","For the other four markets the model reports the price needed for an 18% margin. In Germany the buyer's landed cost at that price would be about 7.8% above the average import price, which suggests the target is hard to reach there without lower freight."],"partner_verdicts":{"SAU":"Viable at current price; protect.","ARE":"Viable at current price; confirm the market size, since the partner does not report.","NLD":"Required price shown; duty to be verified before quoting.","GBR":"Required price lands close to the market's average import price; worth testing.","DEU":"Required price lands above the market average; viable only with better freight or a premium position.","KWT":"Required price shown; destination delivery cost still missing."}},"risks":{"diagnostic":["What do buyers in the United Kingdom and Germany pay today for comparable product?","Is the Netherlands gap explained by goods moving through Dutch ports to other markets?"],"macro":["Freight on the modelled lanes can move well outside the estimated range.","Exchange-rate moves change the cost of goods in dollars; see the FX sensitivity in the workbook."],"data_limits":["All trade data in this demonstration are synthetic.","2026 is a partial year and is excluded from trends."]},"next_steps":{"two_weeks":["Request two buyer price indications each in the United Kingdom and Germany.","Verify the Netherlands duty rate and the Kuwait destination delivery cost."],"thirty_days":["Get forwarder quotes for the Germany and Kuwait lanes to replace the modelled freight.","Re-run the financial model with the confirmed prices and rates."],"ninety_days":["Ship a trial container to the best-scoring expansion market and record the actual landed cost."]}}},"lanes":{"SAU":{"perspective":"export","partner":"SAU","unit":"kg","model_currency":"USD","cost_currency":"EGP","price_currency":"USD","container_type":"40RF","units_per_container":24000.0,"net_kg_per_unit":1.0,"fx_cost_per_model":50.0,"fx_price_per_model":1.0,"insurance_rate_pct":0.4,"target_margin_pct":18.0,"cost_per_unit":38.0,"price_per_unit":1.12,"cost_basis":"EXW","incoterm_raw":"CFR","incoterm":"CFR","credit_days":30.0,"advance_pct":20.0,"customer_credit_days":null,"production_lead_days":21.0,"origin_dwell_days":4.0,"clearance_days":null,"inventory_days":null,"fixed_annual":18000.0,"fixed_one_time":9000.0,"planned_containers_per_year":24.0,"freight_low":1450.0,"freight_base":1450.0,"freight_high":1450.0,"freight":1450.0,"origin_inland":350.0,"origin_docs":120.0,"origin_thc":0.0,"destination_thc":0.0,"import_clearance":260.0,"destination_inland":400.0,"transit_days_base":6.0,"duty_rate_pct":0.0,"other_duties_pct":0.0,"import_vat_pct":15.0,"valuation_basis":"CIF","vat_recoverable":true,"benchmark_uv_usd_per_kg":1.1021,"tiers":{"units_per_container":"user","net_kg_per_unit":"derived","fx_cost_per_model":"user","fx_price_per_model":"derived","insurance_rate_pct":"user","target_margin_pct":"user","cost_per_unit":"user","price_per_unit":"user","credit_days":"user","advance_pct":"user","customer_credit_days":"missing","production_lead_days":"user","origin_dwell_days":"user","clearance_days":"missing","inventory_days":"missing","fixed_annual":"user","fixed_one_time":"user","planned_containers_per_year":"user","freight":"quote","origin_inland":"quote","origin_docs":"quote","origin_thc":"quote","destination_thc":"quote","imp     CH.wfa = st.a ? function (w) { return waterfallChart(w, st.a, (isExp ? "Seller side" : "Landed cost and margin") + " waterfall in " + CUR); } : null;
    CH.wfb = st.b ? function (w) { return waterfallChart(w, st.b, "Buyer side waterfall in " + CUR); } : null;
    h += '<div class="grid2"><section class="card"><h3>' + (isExp ? "Seller side: your cost and margin" : "Landed cost and margin") + '</h3><div class="legend"><span><span class="sw" style="background:#1d5c8a"></span>supplier / seller pays</span>' + (isExp ? "" : '<span><span class="sw" style="background:#8a5a00"></span>you pay</span>') + '</div>' + (st.a ? '<div class="chart" id="ch_wfa"></div>' : '<p class="note">Margin not available.</p>') + "</section>";
    if (isExp) h += '<section class="card"><h3>Buyer side: landed cost at destination</h3><div class="legend"><span><span class="sw" style="background:#8a5a00"></span>buyer pays</span></div>' + (st.b ? '<div class="chart" id="ch_wfb"></div>' : '<p class="note">Buyer landed cost needs: ' + esc(missingList(res.buyer_side_missing || [])) + ".</p>") + "</section>";
    else {
      h += '<section class="card"><h3>Cost line items</h3>' + wfTable(res) + "</section>";
    }
    h += "</div>";
    if (isExp) h += '<section class="card"><h3>Cost line items</h3>' + wfTable(res) + "</section>";
  }
  // lanes table
  h += '<section class="card"><h3>Lanes compared (base case: base freight, no shocks)</h3>' + lanesTable() + "</section>";
  // portfolio
  var pf = portfolioFor(o);
  h += '<section class="card"><h3>Portfolio payback' + (wiActive() ? ' <span class="tb tb-modelled">what-if</span>' : "") + '</h3>';
  if (pf.payback_month != null || (pf.monthly[0] && pf.monthly[0].cumulative != null)) {
    h += '<div class="tiles"><div class="tile"><div class="l">Payback month</div><div class="v">' + (pf.payback_month == null ? "none in 24" : pf.payback_month) + '</div><div class="s">cumulative cash turns positive</div></div>' +
      tile("Plan", num(pf.planned, 1) + " containers/yr", "weighted margin " + money(pf.weighted_margin, 0) + " per container") + tile("Annual margin", money(pf.annual_margin, 0), "before fixed " + money(pf.annual_fixed, 0)) +
      tile("Cash lag", pf.lag + " months", "weighted cash cycle " + num(pf.cycle_days, 0) + " days") + "</div>";
    CH.pay = function (w) { return paybackChart(w, pf); };
    h += '<div class="chart" id="ch_pay"></div>';
    h += '<p class="note">Cumulative cash per month. Containers: ' + esc(pf.basis || "") + (pf.basis && pf.basis.indexOf("derived") === 0 ? ' <span class="tb tb-derived">derived</span>' : "") + ". Lanes included: " + pf.included.map(nm).map(esc).join(", ") + (pf.excluded.length ? ". Excluded (no margin or no plan): " + pf.excluded.map(nm).map(esc).join(", ") : "") + ".</p>";
  } else h += '<p class="msg info">Payback cannot be computed: ' + esc(pf.note || "inputs missing") + "</p>";
  h += "</section>";
  out.innerHTML = h;
}
function wfTable(res) {
  return '<div class="tw"><table><caption class="sr">Cost line items per container</caption><thead><tr><th scope="col">Item</th><th scope="col">Paid by</th><th scope="col" class="n">' + esc(CUR) + '</th><th scope="col">Tier</th></tr></thead><tbody>' + res.waterfall.map(function (w) {
    return "<tr><td>" + esc(w.label) + "</td><td>" + esc(w.side === "seller" ? (isExp ? "you / seller" : "supplier") : (isExp ? "buyer" : "you")) + '</td><td class="n">' + (w.amount == null ? "missing" : num(w.amount, 2)) + "</td><td>" + (w.amount === 0 && /included/.test(w.label) ? "" : badge(w.tier, true)) + "</td></tr>";
  }).join("") + "</tbody></table></div>";
}
function lanesTable() {
  var wi = wiActive();
  return '<div class="tw"><table><caption class="sr">Lane comparison</caption><thead><tr><th scope="col">Lane</th><th scope="col">Status</th><th scope="col" class="n">Price / ' + esc(UNIT) + '</th><th scope="col" class="n">Revenue</th><th scope="col" class="n">Cost</th><th scope="col" class="n">Margin</th><th scope="col" class="n">Margin %</th><th scope="col" class="n">Buyer landed / ' + esc(UNIT) + "</th><th scope=\"col\" class=\"n\">Gap</th>" + (wi ? '<th scope="col" class="n">Margin (what-if)</th>' : "") + "</tr></thead><tbody>" + LANE_ISOS.map(function (iso) {
    var li = LAN[iso], r = BASE[iso], cur = iso === S.lane ? ' class="cur"' : "";
    var link = '<button class="linkbtn" data-lane="' + esc(iso) + '">' + esc(nm(iso)) + "</button>";
    if (r.status !== "modelled") return "<tr" + cur + "><td>" + link + "</td><td><strong>" + esc(r.status) + '</strong></td><td colspan="' + (wi ? 8 : 7) + '">' + (r.status === "error" ? esc(r.errors.join("; ")) : "Missing: " + esc(missingList(r.missing))) + "</td></tr>";
    var t = laneTier(li, r), w = wi ? ENGINE.computeLane(li, wiOpts()) : null;
    return "<tr" + cur + "><td>" + link + "</td><td>modelled</td><td class=\"n\">" + perUnit(r.price_per_unit, li.price_currency) + (r.price_basis !== "user" && isExp ? " " + badge("derived") : "") + '</td><td class="n">' + num(r.revenue) + badge(t) + '</td><td class="n">' + num(r.user_cost) + badge(t) + '</td><td class="n ' + (r.margin == null ? "" : r.margin >= 0 ? "pos" : "neg") + '">' + (r.margin == null ? "—" : num(r.margin)) + badge(t) +
      '</td><td class="n">' + pct(r.margin_pct) + '</td><td class="n">' + perUnit(r.buyer_landed_per_unit) + '</td><td class="n">' + (r.price_gap_pct == null ? "—" : pct(r.price_gap_pct, true)) + "</td>" + (wi ? '<td class="n">' + (w.margin == null ? "—" : num(w.margin)) + "</td>" : "") + "</tr>";
  }).join("") + "</tbody></table></div>";
}

// ---------- sources
function notesList() {
  var n = [];
  (M.warnings || []).forEach(function (w) { n.push(["Analysis", w]); });
  if (PARTIAL.length) n.push(["Years", "Partial year(s) " + PARTIAL.join(", ") + ": too few reporters; shown hatched, left out of growth rates, rankings and scores. Latest complete year is " + M.latest_complete_year + "; base year " + M.base_year + "."]);
  var v = M.views || {};
  Object.keys(v).forEach(function (k) { if (v[k] === false) n.push(["Data views", "View not loaded: " + k.replace(/_/g, " ") + ". Related checks are skipped, nothing was estimated."]); });
  if (FIN) {
    Object.keys(FIN.lanes || {}).forEach(function (i) {
      var l = FIN.lanes[i];
      (l.errors || []).forEach(function (e) { n.push(["Financial " + nm(i), "Input error: " + e]); });
      (l.notes || []).forEach(function (e) { n.push(["Financial " + nm(i), e]); });
      if (l.status === "incomplete") n.push(["Financial " + nm(i), "Incomplete, missing: " + missingList(l.missing || [])]);
    });
    ((FIN.portfolio || {}).notes || []).forEach(function (e) { n.push(["Portfolio", e]); });
    if (FIN.portfolio && FIN.portfolio.payback_note) n.push(["Portfolio", FIN.portfolio.payback_note]);
  } else LANE_ISOS.forEach(function (i) { (LAN[i].notes || []).forEach(function (e) { n.push(["Lane " + nm(i), e]); }); });
  if (FRT) Object.keys(FRT.lanes || {}).forEach(function (i) { var l = FRT.lanes[i]; if (SEL.length && SEL.indexOf(i) < 0) return; if (l.coverage_gap) n.push(["Freight " + nm(i), "Coverage gap: no price available."]); (l.notes || []).forEach(function (e) { n.push(["Freight " + nm(i), e]); }); });
  if (TAR) Object.keys(TAR.lanes || {}).forEach(function (i) { var l = TAR.lanes[i]; if (SEL.length && SEL.indexOf(i) < 0) return; if (l.status !== "sourced") n.push(["Tariff " + nm(i), "Status is verify: confirm rates against the official schedule before relying on them."]); if (l.notes) n.push(["Tariff " + nm(i), l.notes]); });
  return n;
}
function renderSources() {
  var s = S.sq, tiers = ["all"].concat(TIERS_ALL());
  var h = '<h2 class="ph">Sources</h2><section class="card"><h2>Sourced values used</h2><p class="note">Every commercial, freight and tariff value behind the economics, with its tier. Tiers other than user and quote are estimates or third-party figures and belong on the verification list.</p>' +
    '<div class="filters noprint"><label for="s_q">Search<input type="search" id="s_q" value="' + esc(s.q) + '" placeholder="Item, lane or source"></label><label for="s_tier">Tier<select id="s_tier">' + tiers.map(function (t) { return '<option value="' + t + '"' + (s.tier === t ? " selected" : "") + ">" + (t === "all" ? "All tiers" : t) + "</option>"; }).join("") + '</select></label><label class="ck"><input type="checkbox" id="s_verify"' + (s.verify ? " checked" : "") + '> Needs verification (not user or quote)</label></div><div id="src_out"></div></section>';
  var nl = notesList();
  h += '<section class="card"><h2>Data notes</h2>' + (nl.length ? '<ul class="clean">' + nl.map(function (x) { return "<li><strong>" + esc(x[0]) + ":</strong> " + esc(x[1]) + "</li>"; }).join("") + "</ul>" : '<p class="note">No warnings.</p>') + "</section>";
  $("p-sources").innerHTML = h;
  renderSrcOut();
}
function TIERS_ALL() { return ["user", "quote", "connector", "published", "modelled", "derived", "missing"]; }
function renderSrcOut() {
  var s = S.sq, q = s.q.trim().toLowerCase();
  var rows = SRC.filter(function (r) {
    if (s.verify && !needsVerify(r)) return false;
    if (s.tier !== "all" && r.tier !== s.tier) return false;
    if (q && (keyLabel(r.key) + " " + (r.lane ? nm(r.lane) : "") + " " + (r.source || "")).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var h = '<p class="note" role="status">' + rows.length + " of " + SRC.length + " values shown; " + SRC.filter(needsVerify).length + " need verification.</p>";
  if (!SRC.length) h = '<p class="msg info">No sourced values yet: the study has no commercial inputs or the financial stage has not run.</p>';
  else h += '<div class="tw"><table><caption class="sr">Sourced values</caption><thead><tr><th scope="col">Item</th><th scope="col">Lane</th><th scope="col" class="n">Value</th><th scope="col">Tier</th><th scope="col">Source</th><th scope="col">As of</th></tr></thead><tbody>' + rows.map(function (r) {
    var u = safeUrl(r.url);
    return "<tr><td>" + esc(keyLabel(r.key)) + "</td><td>" + (r.lane ? esc(nm(r.lane)) : "all") + '</td><td class="n">' + srcValue(r) + "</td><td>" + badge(r.tier, true) + "</td><td>" + esc(r.source || "") + (u ? ' <a href="' + esc(u) + '" rel="noopener noreferrer" target="_blank">link<span class="sr"> (opens source)</span></a>' : "") + "</td><td>" + esc(r.as_of || "—") + "</td></tr>";
  }).join("") + "</tbody></table></div>";
  $("src_out").innerHTML = h;
}

// ---------- rendering control
var RENDER = {overview: renderOverview, markets: renderMarkets, detail: renderDetail, economics: renderEconomics, sources: renderSources};
function drawCharts() {
  var els = document.querySelectorAll(".chart");
  Array.prototype.forEach.call(els, function (el) {
    var id = el.id.replace(/^ch_/, ""), fn = CH[id];
    if (!fn || !el.offsetParent && !document.body.classList.contains("printing")) return;
    var w = Math.max(280, Math.floor(el.clientWidth));
    if (!el.clientWidth) return;
    el.innerHTML = fn(w);
  });
}
function show(tab, focusPanel) {
  S.tab = tab;
  TABS.forEach(function (t) { $("p-" + t[0]).classList.toggle("on", t[0] === tab); });
  RENDER[tab]();
  renderTabs();
  drawCharts();
  if (focusPanel) $("p-" + tab).focus({preventScroll: true});
  try { history.replaceState(null, "", "#" + tab); } catch (e) { /* file: pages may refuse */ }
}
function openPartner(iso) { S.partner = iso; show("detail", false); window.scrollTo(0, 0); }

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab],[data-sort],[data-open],[data-lane],[data-goto-verify]"); if (!t) return;
  if (t.hasAttribute("data-tab")) return show(t.getAttribute("data-tab"), true);
  if (t.hasAttribute("data-sort")) { var k = t.getAttribute("data-sort"); S.sort = {k: k, dir: S.sort.k === k ? -S.sort.dir : (k === "name" || k === "mirror" || k === "tier" ? 1 : -1)}; renderMarkets(); drawCharts(); var b = document.querySelector('[data-sort="' + k + '"]'); if (b) b.focus(); return; }
  if (t.hasAttribute("data-open")) return openPartner(t.getAttribute("data-open"));
  if (t.hasAttribute("data-lane")) { S.lane = t.getAttribute("data-lane"); return show("economics", false); }
  if (t.hasAttribute("data-goto-verify")) { S.sq.verify = true; show("sources", false); }
});
document.addEventListener("keydown", function (e) {
  var tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  var i = TABS.map(function (x) { return x[0]; }).indexOf(S.tab), n = TABS.length, j = null;
  if (e.key === "ArrowRight") j = (i + 1) % n; else if (e.key === "ArrowLeft") j = (i + n - 1) % n; else if (e.key === "Home") j = 0; else if (e.key === "End") j = n - 1;
  if (j == null) return;
  e.preventDefault(); show(TABS[j][0], false); $("t-" + TABS[j][0]).focus();
});
document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "f_q") { S.f.q = e.target.value; renderMarketsOut(); drawCharts(); }
  else if (id === "s_q") { S.sq.q = e.target.value; renderSrcOut(); }
  else if (/^e_(price|cost|fx|duty)$/.test(id)) {
    var key = id.slice(2), v = parseFloat(e.target.value); WI[key] = v;
    $("o_" + id).textContent = fmtShock(v, key === "duty" ? "pp" : "%");
    updateEcon(); drawCharts();
  }
});
document.addEventListener("change", function (e) {
  var id = e.target.id, name = e.target.name;
  if (id === "f_tier") { S.f.tier = e.target.value; renderMarketsOut(); drawCharts(); }
  else if (id === "f_sel" || id === "f_scored" || id === "f_home") { S.f[id.slice(2)] = e.target.checked; renderMarketsOut(); drawCharts(); }
  else if (id === "d_sel") { S.partner = e.target.value; renderDetail(); drawCharts(); $("d_sel").focus(); }
  else if (id === "e_lane") { S.lane = e.target.value; renderEconomics(); drawCharts(); $("e_lane").focus(); }
  else if (name === "e_scn") { WI.scn = e.target.value; updateEcon(); drawCharts(); }
  else if (id === "s_tier") { S.sq.tier = e.target.value; renderSrcOut(); }
  else if (id === "s_verify") { S.sq.verify = e.target.checked; renderSrcOut(); }
});
document.addEventListener("click", function (e) {
  if (e.target.id === "e_reset") { WI = {scn: "base", price: 0, cost: 0, fx: 0, duty: 0}; renderEconomics(); drawCharts(); $("e_reset").focus(); }
});
var rt = null;
window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
function renderAll() { Object.keys(RENDER).forEach(function (k) { RENDER[k](); }); }
window.addEventListener("beforeprint", function () { document.body.classList.add("printing"); renderAll(); drawCharts(); });
window.addEventListener("afterprint", function () { document.body.classList.remove("printing"); show(S.tab, false); });

renderHeader();
var h0 = (location.hash || "").replace("#", "");
show(RENDER[h0] ? h0 : "overview", false);
})();
</script>
</body>
</html>
